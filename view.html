<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Viewing document — Isaiah Hessler</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/view.css">
</head>
<body class="view-page">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html">Isaiah Hessler<span class="logo-dot">.</span></a>
    <a href="index.html#writing" class="nav-link nav-link--cv">◂ Back to portfolio</a>
  </div>
</header>

<main class="view-main">
  <div class="wrap view-toolbar">
    <div class="view-toolbar-text">
      <p class="slug">WRITING SAMPLE</p>
      <h1 class="view-title" id="docTitle">Loading document…</h1>
    </div>
    <a class="btn btn--ghost" id="downloadLink" href="#" download>Download PDF</a>
  </div>

  <div class="wrap">
    <div class="pdf-frame-wrap" id="pdfFrameWrap">
      <iframe id="pdfFrame" class="pdf-frame" title="PDF document" src=""></iframe>
    </div>

    <!-- Shown only if the PDF can't be found / query param is missing -->
    <div class="pdf-fallback" id="pdfFallback" hidden>
      <p class="slug">Document not found</p>
      <p>We couldn't load that file. It may have moved, or the link is missing a
        filename. Head back to the <a class="link-choice" href="index.html#writing">writing samples</a>
        section to try another one.</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span id="year"></span> Isaiah Hessler</p>
    <a href="index.html#top" class="back-to-top">Back to top ▴</a>
  </div>
</footer>

<script src="js/script.js"></script>
<script src="js/view.js"></script>
</body>
</html>
